name: "✨ 기능 제안 (Feature)"
description: 새로운 기능이나 개선 아이디어를 제안해요
title: "[Feature] "
labels: ["type: feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      placeholder: "예) 사용자가 지난주 감정 변화를 한눈에 보기 어려워요"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 제안하는 기능
      placeholder: "예) 주간 감정 그래프와 많이 언급한 키워드를 보여주는 리포트 화면"
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 조건 (Acceptance Criteria)
      description: 이 조건을 모두 만족하면 Done 으로 옮겨요
      placeholder: |
        - [ ] 최근 7일 감정 분포 그래프가 보인다
        - [ ] 기록이 없을 때 안내 문구가 나온다
    validations:
      required: true
  - type: dropdown
    id: points
    attributes:
      label: 예상 작업량 (Story Point)
      description: 등록 후 같은 숫자의 points 라벨을 붙여주세요
      options: ["1 (반나절)", "2 (하루)", "3 (2~3일)", "5 (일주일)", "8 (일주일 이상 → 쪼개기 권장)"]
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 작업 영역
      options: ["앱 (Flutter)", "서버 (FastAPI)", "AI 연동", "CI/CD·자동화", "문서"]
    validations:
      required: true
